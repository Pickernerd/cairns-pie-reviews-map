<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cairns Pie Reviews</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
            background: #1a1a1a;
        }

        /* Sidebar */
        #sidebar {
            width: 380px;
            min-width: 320px;
            background: #222;
            color: #fff;
            padding: 20px;
            box-shadow: 4px 0 10px rgba(0,0,0,0.5);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            border-right: 3px solid #8B4513;
        }

        .header-title {
            text-align: center;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #f5f5f5;
            margin: 0 0 5px 0;
            text-transform: uppercase;
        }

        .leaderboard-title {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            color: #ffcc00;
            border-bottom: 2px dashed #444;
            padding-bottom: 10px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .leaderboard-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .leaderboard-item {
            display: flex;
            align-items: center;
            background: #2b2b2b;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 6px;
            border-left: 5px solid #555;
        }

        .leaderboard-item.rank-1 {
            border-left-color: #ffcc00;
            background: #332b00;
        }

        .rank {
            font-size: 20px;
            font-weight: bold;
            width: 30px;
            text-align: center;
            color: #ffcc00;
        }

        .shop-name {
            flex-grow: 1;
            font-weight: 600;
            padding-left: 10px;
            font-size: 15px;
        }

        .score {
            font-size: 18px;
            font-weight: bold;
            color: #ffcc00;
            padding-right: 5px;
        }

        #map {
            flex-grow: 1;
            height: 100vh;
        }

        .reviewer-avatar {
            border-radius: 6px;
            border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            object-fit: cover;
            display: block;
        }

        .leader-gold {
            border: 3px solid gold !important;
            box-shadow: 0 0 10px gold;
        }

        .marker-physics {
            transform-origin: bottom center;
            transition: transform 0.35s ease-out;
            will-change: transform;
        }

        .marker-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 22%;
            background: rgba(0,0,0,0.55);
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2px 4px;
            border-radius: 0 0 6px 6px;
        }

        .popup-card {
            font-size: 14px;
            line-height: 1.4;
            width: 220px;
            color: #333;
        }

        .popup-card h3 {
            margin: 0 0 5px 0;
            color: #8B4513;
            border-bottom: 1px solid #ddd;
            padding-bottom: 4px;
            font-size: 16px;
        }

        .score-tag {
            display: inline-block;
            background: #f0f0f0;
            padding: 4px 8px;
            border-radius: 4px;
            margin-top: 6px;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            #sidebar { width: 100%; height: 40vh; min-width: auto; }
            #map { height: 60vh; }
        }
    </style>
</head>

<body>

    <div id="sidebar">
        <div class="header-title">Cairns Pie Reviews</div>
        <div class="leaderboard-title">Leaderboard</div>

        <ul class="leaderboard-list">
            <li class="leaderboard-item rank-1">
                <span class="rank">1</span>
                <span class="shop-name">Bushman Pies</span>
                <span class="score">7.8 👑</span>
            </li>
            <li class="leaderboard-item">
                <span class="rank">2</span>
                <span class="shop-name">Ocean World Seafood</span>
                <span class="score">5.2</span>
            </li>
            <li class="leaderboard-item"><span class="rank">3</span><span class="shop-name">---</span></li>
            <li class="leaderboard-item"><span class="rank">4</span><span class="shop-name">---</span></li>
            <li class="leaderboard-item"><span class="rank">5</span><span class="shop-name">---</span></li>
        </ul>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const map = L.map('map').setView([-16.920, 145.755], 13);

       L.tileLayer('https://tiles.stadiamaps.com/tiles/stamen_toner/{z}/{x}/{y}{r}.png?api_key=YOUR-API-KEY', {
    minZoom: 0,
    maxZoom: 20,
    attribution: '&copy; <a href="https://stadiamaps.com/" target="_blank">Stadia Maps</a> &copy; <a href="https://stamen.com/" target="_blank">Stamen Design</a> &copy; <a href="https://openmaptiles.org/" target="_blank">OpenMapTiles</a> &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

        const pieShops = [
            {
                name: "Ocean World Seafood",
                lat: -16.903171,
                lng: 145.757099,
                reviewer: "Darien",
                image: "OceanWorld",
                fingersDeep: 3,
                crust: 7.3,
                filling: 3.1,
                overall: 5.2,
                pie: "Curried Scallop Pie"
            },
            {
                name: "Bushman Pies",
                lat: -16.938892,
                lng: 145.754252,
                reviewer: "Darien",
                image: "Bushmans",
                fingersDeep: 2,
                crust: 7.4,
                filling: 7.4,
                overall: 7.8,
                pie: "Tradies Pie"
            }
        ];

        const leaderScore = Math.max(...pieShops.map(s => s.overall));
        const pieShopsMarkers = [];

        pieShops.forEach(shop => {
            const iconUrl = `${shop.image}_${shop.reviewer}.png`;
            const borderClass = shop.overall === leaderScore ? "leader-gold" : "";

            const customIcon = L.divIcon({
                html: `
                    <div class="marker-body marker-physics" style="position:relative; width:50px; height:100px;">
                        <img
                            src="${iconUrl}"
                            class="reviewer-avatar ${borderClass}"
                            width="50"
                            height="100"
                            alt="${shop.reviewer} at ${shop.name}"
                        >
                        <div class="marker-overlay">
                            <span>${shop.overall}</span>
                            <span style="
                                display:inline-block;
                                width:16px;
                                height:16px;
                                border-radius:50%;
                                background:#ffcc00;
                                color:#000;
                                font-size:11px;
                                font-weight:900;
                                text-align:center;
                                line-height:16px;
                            ">i</span>
                        </div>
                    </div>
                `,
                className: 'custom-marker',
                iconSize: [50, 100],
                iconAnchor: [25, 100]
            });

            const marker = L.marker([shop.lat, shop.lng], { icon: customIcon }).addTo(map);

            const el = marker._icon.querySelector(".marker-body");
            marker.physics = { el };
            pieShopsMarkers.push(marker);

            const popupContent = `
                <div class="popup-card">
                    <h3>${shop.name}</h3>
                    <strong>Reviewer:</strong> ${shop.reviewer}<br>
                    <strong>Pie:</strong> ${shop.pie}<br>
                    <hr style="border:0; border-top:1px dashed #ccc; margin:8px 0;">
                    🥧 <strong>Crust:</strong> ${shop.crust}/10<br>
                    🥩 <strong>Filling:</strong> ${shop.filling}/10<br>
                    ✌️ <strong>Fingers Deep:</strong> ${shop.fingersDeep}<br>
                    <div class="score-tag" style="color: ${shop.overall >= 7 ? '#2e7d32' : '#c62828'}">
                        ⭐ Overall: ${shop.overall}/10
                    </div>
                </div>
            `;

            marker.bindPopup(popupContent);
        });

        let lastCenter = null;

        map.on("drag", () => {
            const center = map.getCenter();

            if (lastCenter) {
                const dx = center.lng - lastCenter.lng;
                const dy = center.lat - lastCenter.lat;

                pieShopsMarkers.forEach(marker => {
                    const tilt = dx * 4000;
                    const bob = dy * -4000;

                    marker.physics.el.style.transform =
                        `translate(${tilt * 0.20}px, ${Math.abs(bob) * 0.16}px) rotate(${tilt * 0.8}deg)`;
                });
            }

            lastCenter = center;
        });

        map.on("dragend", () => {
            lastCenter = null;

            pieShopsMarkers.forEach(marker => {
                marker.physics.el.style.transform = 'translate(0px, 0px) rotate(0deg)';
            });
        });
    </script>

</body>
</html>
