<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cairns Pie Reviews</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
            background: #1a1a1a;
        }

        /* Sidebar */
        #sidebar {
            width: 380px;
            min-width: 320px;
            background: #222;
            color: #fff;
            padding: 20px;
            box-shadow: 4px 0 10px rgba(0,0,0,0.5);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            border-right: 3px solid #8B4513;
        }

        .header-logo {
            max-width: 100%;
            max-height: 140px;
            height: auto;
            display: block;
            margin: 0 auto 10px auto;
        }
        .header-title {
            text-align: center;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #f5f5f5;
            margin: 0 0 5px 0;
            text-transform: uppercase;
        }

        .leaderboard-title {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            color: #ffcc00;
            border-bottom: 2px dashed #444;
            padding-bottom: 10px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .leaderboard-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .leaderboard-item {
            display: flex;
            align-items: center;
            background: #2b2b2b;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 6px;
            border-left: 5px solid #555;
        }

        .leaderboard-item.rank-1 {
            border-left-color: #ffcc00;
            background: #332b00;
        }

        .rank {
            font-size: 20px;
            font-weight: bold;
            width: 30px;
            text-align: center;
            color: #ffcc00;
        }

        .shop-name {
            flex-grow: 1;
            font-weight: 600;
            padding-left: 10px;
            font-size: 15px;
        }

        .score {
            font-size: 18px;
            font-weight: bold;
            color: #ffcc00;
            padding-right: 5px;
        }

    #map-wrapper {
    position: relative;
    flex-grow: 1;
    height: 100vh;
    min-width: 0;
}

#map {
    width: 100%;
    height: 100%;
}

#offscreen-indicators {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    pointer-events: none;
    z-index: 900;
}

.offscreen-indicator {
    position: absolute;
    width: 48px;
    height: 48px;
    margin-left: -24px;
    margin-top: -24px;
    border-radius: 50%;
    
    /* Aussie Meat Pie Palette */
    background: radial-gradient(circle at 35% 35%, #F4A460 0%, #D2691E 55%, #8B4513 100%);
    border: 3px dashed #654321; /* Scalloped pastry rim effect */
    box-shadow: inset 0 2px 4px rgba(255,255,255,0.4), 0 4px 8px rgba(0,0,0,0.5);
    
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 900;
}

.offscreen-indicator .arrow {
    display: block;
    width: 22px;
    height: 22px;
    /* Clean outer glow/shadow so dark brown contrasts off the golden pastry top */
    filter: drop-shadow(0px 1px 1px rgba(255, 235, 180, 0.8)) drop-shadow(0px 2px 3px rgba(0, 0, 0, 0.4));
    transform-origin: center center;
}

.offscreen-indicator .count {
    position: absolute;
    bottom: -6px;
    right: -6px;
    min-width: 18px;
    height: 18px;
    padding: 0 4px;
    border-radius: 10px;
    background: #8B4513;
    color: #fff;
    font-size: 11px;
    line-height: 18px;
    text-align: center;
    font-weight: 700;
}

        .reviewer-avatar {
            border-radius: 6px;
            border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            object-fit: cover;
            display: block;
        }

        .leader-gold {
            border: 3px solid gold !important;
            box-shadow: 0 0 10px gold;
        }

        .marker-physics {
            transform-origin: bottom center;
            transition: transform 0.60s ease-out;
            will-change: transform;
        }

        .marker-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 22%;
            background: rgba(0,0,0,0.55);
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2px 4px;
            border-radius: 0 0 6px 6px;
        }

        .popup-card {
            font-size: 14px;
            line-height: 1.4;
            width: 220px;
            color: #333;
        }

        .popup-card h3 {
            margin: 0 0 5px 0;
            color: #8B4513;
            border-bottom: 1px solid #ddd;
            padding-bottom: 4px;
            font-size: 16px;
        }

        .score-tag {
            display: inline-block;
            background: #f0f0f0;
            padding: 4px 8px;
            border-radius: 4px;
            margin-top: 6px;
            font-weight: bold;
        }

       @media (max-width: 768px) {
    body { flex-direction: column; }
    #sidebar { width: 100%; height: 40vh; min-width: auto; }
    #map-wrapper { height: 60vh; }

    /* Keeps logo compact so leaderboard items fit */
    .header-logo {
        max-height: 65px;
    }
}
    </style>
</head>

<body>

   <div id="sidebar">
    <div class="header-title">
       <img src="300Logo.png" alt="cairns Pie Reviews Leaderboard" class="header-logo">
        Cairns Pie Reviews
    </div>
    <div class="leaderboard-title">Leaderboard</div>
        <ul class="leaderboard-list"></ul>
    </div>

    <div id="map-wrapper">
    <div id="map"></div>
    <div id="offscreen-indicators"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
const map = L.map('map').setView([-16.920, 145.755], 14);

L.tileLayer(
    'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
    {
        attribution:
            '&copy; OpenStreetMap contributors &copy; CARTO',
        subdomains: 'abcd',
        maxZoom: 20
    }
).addTo(map);

let pieShopsMarkers = [];

fetch('reviewdata.json')
    .then(response => response.json())
    .then(data => {

        const liveReviews = data.reviews.filter(
            review => review.review_status === "live"
        );

        // Get latest review for each business
        const latestReviews = [];

        data.businesses.forEach(business => {

            const businessReviews = liveReviews
                .filter(r => r.business_id === business.business_id)
                .sort(
                    (a, b) =>
                        new Date(b.review_date) -
                        new Date(a.review_date)
                );

            if (businessReviews.length > 0) {

                latestReviews.push({
                    ...business,
                    ...businessReviews[0],
                    review_count: businessReviews.length
                });

            }
        });

        buildLeaderboard(latestReviews);
        buildMarkers(latestReviews);
        updateOffscreenIndicators();

    });

function updateOffscreenIndicators() {
    const container = document.getElementById('offscreen-indicators');
    container.innerHTML = '';

    const mapSize = map.getSize();
    
    // Set custom inset distances for each edge (in pixels)
    const paddingTop = 60;    // Clears Leaflet top-left zoom controls (+/-)
    const paddingBottom = 45; // Clears bottom-right attribution text
    const paddingLeft = 60;   // Inset from left edge
    const paddingRight = 40;  // Inset from right edge

    pieShopsMarkers.forEach(marker => {
        const latlng = marker.getLatLng();
        const point = map.latLngToContainerPoint(latlng);

        // Check if visible using the expanded inset bounds
        const isVisible =
            point.x >= paddingLeft &&
            point.x <= mapSize.x - paddingRight &&
            point.y >= paddingTop &&
            point.y <= mapSize.y - paddingBottom;

        if (isVisible) return;

        const centre = L.point(mapSize.x / 2, mapSize.y / 2);
        const dx = point.x - centre.x;
        const dy = point.y - centre.y;
        const angle = Math.atan2(dy, dx) * (180 / Math.PI);

        // Clamp indicator coordinates within the inset boundary
        const clampedX = Math.max(
            paddingLeft,
            Math.min(mapSize.x - paddingRight, point.x)
        );

        const clampedY = Math.max(
            paddingTop,
            Math.min(mapSize.y - paddingBottom, point.y)
        );

        const indicator = document.createElement('div');
        indicator.className = 'offscreen-indicator';
        indicator.style.left = `${clampedX}px`;
        indicator.style.top = `${clampedY}px`;

        indicator.innerHTML = `
    <svg class="arrow" style="transform: rotate(${angle + 90}deg);" viewBox="0 0 24 24">
        <path fill="#2D1810" stroke="#FFF8E7" stroke-width="0.8" d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/>
    </svg>
`;

        container.appendChild(indicator);
    });
}
       
function buildLeaderboard(reviews) {

    const leaderboard = [...reviews]
        .sort((a, b) => b.overall - a.overall)
        .slice(0, 5);

    const list = document.querySelector('.leaderboard-list');

    list.innerHTML = '';

    leaderboard.forEach((review, index) => {

        const item = document.createElement('li');

        item.className =
            index === 0
                ? 'leaderboard-item rank-1'
                : 'leaderboard-item';

        item.innerHTML = `
            <span class="rank">${index + 1}</span>
            <span class="shop-name">${review.name}</span>
            <span class="score">
                ${review.overall}
                ${index === 0 ? '👑' : ''}
            </span>
        `;

        list.appendChild(item);

    });

}

function buildMarkers(reviews) {

    const leaderScore = Math.max(
        ...reviews.map(r => r.overall)
    );

    reviews.forEach(review => {

        const borderClass =
            review.overall === leaderScore
                ? 'leader-gold'
                : '';

        const customIcon = L.divIcon({
            html: `
                <div class="marker-body marker-physics ${borderClass}"
                     style="position:relative;width:50px;height:100px;">

                    <img src="${review.featured_image}" class="reviewer-avatar" style="width:100%; height:100%;">

                    <div class="marker-overlay">
                        <span>${review.overall}</span>
                        <span style="
                            width:16px;
                            height:16px;
                            border-radius:50%;
                            background:#ffcc00;
                            color:#000;
                            text-align:center;
                            line-height:16px;
                            font-weight:bold;">
                            i
                        </span>
                    </div>

                </div>
            `,
            className: 'custom-marker',
            iconSize: [50, 100],
            iconAnchor: [25, 100]
        });

        const marker = L.marker(
    [review.lat, review.lng],
    { icon: customIcon }
).addTo(map);

marker.reviewData = review;

        const facebookLink =
            review.facebook_share_code
                ? `https://www.facebook.com/share/r/${review.facebook_share_code}`
                : '';

        const popupContent = `
            <div class="popup-card">

                <h3>${review.name}</h3>

                <strong>Pie:</strong>
                ${review.pie_name}<br>

                <strong>Reviewer:</strong>
                ${review.reviewer}<br>

                <strong>Review #:</strong>
                ${review.review_no}<br>

                <strong>Date:</strong>
                ${review.review_date}<br>

                <strong>Total Reviews:</strong>
                ${review.review_count}<br>

                <hr style="border:0;border-top:1px dashed #ccc;margin:8px 0;">

                🥧 <strong>Crust:</strong>
                ${review.crust}/10<br>

                🥩 <strong>Filling:</strong>
                ${review.filling}/10<br>

                ✌️ <strong>Fingers Deep:</strong>
                ${review.fingers_deep}<br>

                <div class="score-tag"
                    style="
                        color:${review.overall >= 7
                            ? '#2e7d32'
                            : '#c62828'};
                    ">
                    ⭐ Overall: ${review.overall}/10
                </div>

               ${
                    facebookLink
                        ? `
                        <p>
                            <a href="${facebookLink}" target="_blank" rel="noopener noreferrer">
                                Watch the review on fb
                            </a>
                        </p>
                        `
                        : ''
                }

            </div>
        `;

        marker.bindPopup(popupContent);

        const el =
            marker._icon.querySelector('.marker-body');

        marker.physics = { el };

        pieShopsMarkers.push(marker);

    });

}

let lastCenter = null;
        
map.on('move zoom resize', updateOffscreenIndicators);
        
map.on("drag", () => {

    const center = map.getCenter();

    if (lastCenter) {

        const currentPx =
            map.latLngToContainerPoint(center);

        const lastPx =
            map.latLngToContainerPoint(lastCenter);

        const dx = currentPx.x - lastPx.x;
        const dy = currentPx.y - lastPx.y;

        pieShopsMarkers.forEach(marker => {

            const tilt = dx * 1.5;
            const bob = dy * -1.5;

            marker.physics.el.style.transform =
                `translate(${tilt * 0.20}px,
                ${Math.abs(bob) * 0.16}px)
                rotate(${tilt * 0.8}deg)`;

        });

    }

    lastCenter = center;

});

map.on("dragend", () => {

    lastCenter = null;

    pieShopsMarkers.forEach(marker => {

        marker.physics.el.style.transform =
            'translate(0px,0px) rotate(0deg)';

    });

});

</script>

</body>
</html>
