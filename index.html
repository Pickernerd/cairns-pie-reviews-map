<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cairns Pie Review Overlay</title>
    <!-- Include Leaflet Maps CSS -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #map { width: 100vw; height: 100vh; }
        .reviewer-avatar { border-radius: 50%; border: 3px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.3); transition: transform 0.2s; }
        .reviewer-avatar:hover { transform: scale(1.15); z-index: 1000; }
        .popup-card { font-size: 14px; line-height: 1.4; width: 220px; }
        .popup-card h3 { margin: 0 0 5px 0; color: #8B4513; border-bottom: 1px solid #ddd; padding-bottom: 4px; font-size: 16px; }
        .score-tag { display: inline-block; background: #f0f0f0; padding: 4px 8px; border-radius: 4px; margin-top: 6px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Include Leaflet Maps JavaScript Library -->
    <script src="https://unpkg.com"></script>
    <script>
        // Initialize the map focused on Cairns region near your locations
        const map = L.map('map').setView([-16.920, 145.755], 13);

        // Load free OpenStreetMap map tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Your exact pie review dataset with custom keys
        const pieShops = [
            { name: "Ocean World Seafood", lat: -16.903171, lng: 145.757099, reviewer: "Darien", fingersDeep: 3, crust: 7.3, filling: 3.1, overall: 5.2, pie: "Curried Scallop Pie"},
            { name: "Bushman Pies", lat: -16.938892, lng: 145.754252, reviewer: "Darien", fingersDeep: 2, crust: 7.4, filling: 7.4, overall: 7.8, pie: "Tradies Pie" }
        ];

        // Loop through each pie shop entry
        pieShops.forEach(shop => {
            let iconUrl = '';

            // Choose face based on your explicit Overall score value
            if (shop.reviewer === "Darien") {
                iconUrl = shop.overall >= 7.0 
                    ? 'https://pravatar.cc'  // Happy face variant
                    : 'https://pravatar.cc'; // Disappointed face variant
            } else {
                iconUrl = shop.overall >= 7.0 
                    ? 'https://pravatar.cc' 
                    : 'https://pravatar.cc';
            }

          // FIXED: Added pixel size arrays so Leaflet can actually compute the pin scales
            const customIcon = L.divIcon({
                html: `<img src="${iconUrl}" class="reviewer-avatar" width="42" height="42" title="${shop.reviewer}'s Review">`,
                className: 'custom-marker',
                iconSize: [42, 42],
                iconAnchor: [21, 21]
            });

            // Format popup window layout containing your customized parameters
            const popupContent = `
                <div class="popup-card">
                    <h3>${shop.name}</h3>
                    <strong>Reviewer:</strong> ${shop.reviewer}<br>
                    <strong>Pie:</strong> ${shop.pie}<br>
                    <hr style="border:0; border-top:1px dashed #ccc; margin:8px 0;">
                    🥧 <strong>Crust:</strong> ${shop.crust}/10<br>
                    🥩 <strong>Filling:</strong> ${shop.filling}/10<br>
                    ✌️ <strong>Fingers Deep:</strong> ${shop.fingersDeep}<br>
                    <div class="score-tag" style="color: ${shop.overall >= 7 ? '#2e7d32' : '#c62828'}">
                        ⭐ Overall: ${shop.overall}/10
                    </div>
                </div>
            `;

            // Display marker on map
            L.marker([shop.lat, shop.lng], { icon: customIcon })
                .addTo(map)
                .bindPopup(popupContent);
        });
    </script>
</body>
</html>
